<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}YTFake{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=20260414-home-three-cols">
  </head>
  <body class="sidebar-collapsed">
    {% block body %}{% endblock %}
    <script>
      (function () {
        const toggle = document.querySelector("[data-sidebar-toggle]");
        if (toggle) {
          toggle.addEventListener("click", function () {
            document.body.classList.toggle("sidebar-collapsed");
          });
        }
      })();

      (function () {
        const forms = Array.from(document.querySelectorAll('form[action="/search"]'));
        if (!forms.length) return;

        forms.forEach(function (form) {
          const input = form.querySelector('input[name="q"]');
          if (!input) return;

          form.classList.add("autocomplete-form");
          const panel = document.createElement("div");
          panel.className = "search-suggestions";
          panel.hidden = true;
          form.appendChild(panel);

          let debounceId = null;
          let activeIndex = -1;
          let lastQuery = "";
          let suggestions = [];

          function hidePanel() {
            panel.hidden = true;
            activeIndex = -1;
          }

          function buildSearchUrl(suggestionText) {
            return "/search?q=" + encodeURIComponent(suggestionText);
          }

          function renderSuggestions(items) {
            suggestions = items;
            activeIndex = -1;
            panel.innerHTML = "";

            if (!items.length) {
              hidePanel();
              return;
            }

            items.forEach(function (item, index) {
              const link = document.createElement("a");
              link.className = "suggestion-item";
              link.href = buildSearchUrl(item.title);
              link.dataset.index = String(index);

              const thumb = document.createElement("span");
              thumb.className = "suggestion-thumb";
              if (item.thumbnail_url) {
                thumb.style.backgroundImage = "url('" + String(item.thumbnail_url).replace(/'/g, "%27") + "')";
              }

              const meta = document.createElement("span");
              meta.className = "suggestion-meta";

              const title = document.createElement("strong");
              title.textContent = item.title;

              const detail = document.createElement("small");
              detail.textContent = "Buscar resultados | " + item.category + " | " + item.channel_name;

              meta.appendChild(title);
              meta.appendChild(detail);
              link.appendChild(thumb);
              link.appendChild(meta);
              panel.appendChild(link);
            });

            panel.hidden = false;
          }

          function setActiveIndex(nextIndex) {
            const items = Array.from(panel.querySelectorAll(".suggestion-item"));
            if (!items.length) return;

            activeIndex = (nextIndex + items.length) % items.length;
            items.forEach(function (item, index) {
              item.classList.toggle("active", index === activeIndex);
            });
          }

          function requestSuggestions() {
            const query = input.value.trim();
            lastQuery = query;

            if (query.length < 2) {
              hidePanel();
              return;
            }

            fetch("/api/search/suggest?q=" + encodeURIComponent(query), { headers: { "Accept": "application/json" } })
              .then(function (response) {
                if (!response.ok) return { suggestions: [] };
                return response.json();
              })
              .then(function (payload) {
                if (input.value.trim() !== lastQuery) return;
                renderSuggestions(payload.suggestions || []);
              })
              .catch(hidePanel);
          }

          input.addEventListener("input", function () {
            window.clearTimeout(debounceId);
            debounceId = window.setTimeout(requestSuggestions, 180);
          });

          input.addEventListener("focus", function () {
            if (suggestions.length) {
              panel.hidden = false;
            } else if (input.value.trim().length >= 2) {
              requestSuggestions();
            }
          });

          input.addEventListener("keydown", function (event) {
            if (panel.hidden) return;
            if (event.key === "ArrowDown") {
              event.preventDefault();
              setActiveIndex(activeIndex + 1);
            } else if (event.key === "ArrowUp") {
              event.preventDefault();
              setActiveIndex(activeIndex - 1);
            } else if (event.key === "Enter" && activeIndex >= 0) {
              const active = panel.querySelector(".suggestion-item.active");
              if (active) {
                event.preventDefault();
                window.location.href = active.href;
              }
            } else if (event.key === "Escape") {
              hidePanel();
            }
          });

          document.addEventListener("click", function (event) {
            if (!form.contains(event.target)) hidePanel();
          });
        });
      })();

      (function () {
        document.querySelectorAll("[data-toggle-label]").forEach(function (button) {
          const originalLabel = button.textContent;
          const toggledLabel = button.getAttribute("data-toggle-label");
          button.addEventListener("click", function () {
            const active = button.classList.toggle("active");
            button.textContent = active ? toggledLabel : originalLabel;
          });
        });

        document.querySelectorAll("[data-toggle-active]").forEach(function (button) {
          function setActiveState(active) {
            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
            const activeLabel = button.getAttribute("data-active-label");
            const inactiveLabel = button.getAttribute("data-inactive-label");
            if (activeLabel && inactiveLabel) {
              button.textContent = active ? activeLabel : inactiveLabel;
            }
          }

          button.addEventListener("click", function () {
            const endpoint = button.getAttribute("data-endpoint");
            const wasActive = button.classList.contains("active") || button.getAttribute("aria-pressed") === "true";
            if (wasActive || !endpoint) return;

            setActiveState(true);

            fetch(endpoint, { method: "POST", headers: { "Accept": "application/json" } })
              .then(function (response) {
                if (!response.ok) throw new Error("engagement failed");
              })
              .catch(function () {
                setActiveState(false);
              });
          });
        });
      })();

      (function () {
        const tabs = Array.from(document.querySelectorAll("[data-watch-tab]"));
        if (!tabs.length) return;

        tabs.forEach(function (tab) {
          tab.addEventListener("click", function () {
            const key = tab.getAttribute("data-watch-tab");
            tabs.forEach(function (item) {
              const isActive = item === tab;
              item.classList.toggle("active", isActive);
              item.setAttribute("aria-selected", isActive ? "true" : "false");
            });
            document.querySelectorAll("[data-watch-panel]").forEach(function (panel) {
              panel.classList.toggle("active", panel.getAttribute("data-watch-panel") === key);
            });
          });
        });
      })();

      (function () {
        const hero = document.querySelector("[data-home-hero]");
        if (!hero) return;

        const slides = Array.from(hero.querySelectorAll("[data-home-hero-slide]"));
        const dots = Array.from(hero.querySelectorAll("[data-home-hero-dot]"));
        if (slides.length < 2) return;

        let activeIndex = 0;
        let timerId = null;

        function showSlide(nextIndex) {
          activeIndex = (nextIndex + slides.length) % slides.length;
          slides.forEach(function (slide, index) {
            const active = index === activeIndex;
            slide.classList.toggle("active", active);
            slide.setAttribute("aria-hidden", active ? "false" : "true");
            slide.style.opacity = active ? "1" : "0";
            slide.style.pointerEvents = active ? "auto" : "none";
            slide.style.transform = active ? "scale(1)" : "scale(1.018)";
          });
          dots.forEach(function (dot, index) {
            dot.classList.toggle("active", index === activeIndex);
          });
        }

        function startTimer() {
          window.clearInterval(timerId);
          timerId = window.setInterval(function () {
            showSlide(activeIndex + 1);
          }, 5200);
        }

        dots.forEach(function (dot, index) {
          dot.addEventListener("click", function () {
            showSlide(index);
            startTimer();
          });
        });

        hero.addEventListener("mouseenter", function () {
          window.clearInterval(timerId);
        });
        hero.addEventListener("mouseleave", startTimer);
        startTimer();
      })();

      (function () {
        const STORAGE_KEY = "ytfake_dev_thumbnails";
        const toggles = Array.from(document.querySelectorAll("[data-dev-thumbnail-toggle]"));
        const targets = Array.from(document.querySelectorAll("[data-thumbnail-target]"));
        if (!toggles.length || !targets.length) return;

        function cssImageUrl(url) {
          return "url('" + String(url || "").replace(/\\/g, "\\\\").replace(/'/g, "%27") + "')";
        }

        function applyMode(devMode) {
          document.body.classList.toggle("developer-thumbnails", devMode);
          toggles.forEach(function (toggle) {
            toggle.classList.toggle("active", devMode);
            toggle.textContent = devMode ? "Modo dev: colores" : "Modo normal: fotos";
          });

          targets.forEach(function (target) {
            const url = devMode
              ? target.getAttribute("data-dev-thumbnail")
              : target.getAttribute("data-real-thumbnail");
            if (!url) return;

            const gradient = target.getAttribute("data-thumbnail-gradient") || "linear-gradient(135deg, rgba(9, 10, 14, 0.18), rgba(9, 10, 14, 0.52))";
            target.style.backgroundImage = gradient + ", " + cssImageUrl(url);
            target.style.backgroundSize = "cover";
            target.style.backgroundPosition = "center";
          });
        }

        let devMode = window.localStorage.getItem(STORAGE_KEY) === "1";
        applyMode(devMode);

        toggles.forEach(function (toggle) {
          toggle.addEventListener("click", function () {
            devMode = !devMode;
            window.localStorage.setItem(STORAGE_KEY, devMode ? "1" : "0");
            applyMode(devMode);
          });
        });
      })();
    </script>
  </body>
</html>
